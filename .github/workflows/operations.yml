name: Operational monitors

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
    - cron: '53 * * * *'
    - cron: '41 6 * * 1'

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  production-readiness:
    name: Sample production readiness
    concurrency:
      group: production-readiness-incident
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 * * * *' || github.event.schedule == '53 * * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sample public readiness and direct THORNode providers
        id: monitor
        continue-on-error: true
        run: >-
          npm run check:production-readiness --
          --base-url https://wiki.thorchain.no
          --samples 3
          --interval-ms 60000
          --artifact .artifacts/readiness-monitor/production-readiness.json
      - name: Upload readiness evidence
        id: readiness_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/readiness-monitor/production-readiness.json
          if-no-files-found: warn
          retention-days: 30
      - name: Reconcile readiness incident and recovery evidence
        if: always() && (steps.monitor.outcome == 'failure' || steps.monitor.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_ARTIFACT_URL: ${{ steps.readiness_evidence.outputs.artifact-url }}
        run: node scripts/update-readiness-incident.mjs .artifacts/readiness-monitor/production-readiness.json
      - name: Fail on persistent degraded readiness
        if: steps.monitor.outcome == 'failure'
        run: exit 1

  content-review-schedule:
    name: Report upcoming content reviews
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 6 * * 1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=optional
      - name: Build content review queue
        id: reviews
        continue-on-error: true
        run: >-
          npm run report:content-reviews --
          --horizon-days 30
          --artifact .artifacts/content-reviews/content-review-schedule.json
      - name: Upload content review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-review-schedule-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/content-reviews/content-review-schedule.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when content reviews are overdue
        if: steps.reviews.outcome == 'failure'
        run: exit 1
