        - heading "Node Types" [level=2] [ref=e219]
        - generic [ref=e220]:
          - generic [ref=e221]:
            - heading "Whitelisted" [level=3] [ref=e222]
            - paragraph [ref=e223]: Bonded, but required node keys have not yet been set; operator setup is incomplete.
          - generic [ref=e224]:
            - heading "Standby" [level=3] [ref=e225]
            - paragraph [ref=e226]: Bonded but not active. Current requirements are evaluated during churn; only Standby nodes outside vault migration may unbond.
          - generic [ref=e227]:
            - heading "Ready" [level=3] [ref=e228]
            - paragraph [ref=e229]: Passed current preflight requirements and is eligible for churn selection; a node cannot unbond while Ready.
          - generic [ref=e230]:
            - heading "Active" [level=3] [ref=e231]
            - paragraph [ref=e232]: Participates in consensus, observation, and signing; it cannot unbond until churned to Standby and clear of vault migration.
          - generic [ref=e233]:
            - heading "Disabled" [level=3] [ref=e234]
            - paragraph [ref=e235]: Completed the permanent-leave path while Standby and cannot rejoin with the same node account.
