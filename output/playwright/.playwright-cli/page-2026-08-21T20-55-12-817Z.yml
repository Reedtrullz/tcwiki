        - heading "Bifrost Bridge and Cross-Chain Observability" [level=1] [ref=e39]
        - paragraph [ref=e40]: How active nodes observe external chains, run chain clients, and why observation evidence is not the same thing as route execution.
      - group [ref=e41]:
