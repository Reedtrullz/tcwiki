      - article [ref=e52]:
        - paragraph [ref=e53]: Bifrost is the component responsible for making THORChain aware of activity on external blockchains.
        - paragraph [ref=e54]: It is both a design concept and an operational surface. The design explains how nodes observe chains and coordinate inbound/outbound activity; live route availability still depends on current chain sync, Mimir controls, inbound-address state, signing state, and source freshness.
        - heading "What Bifrost Does" [level=2] [ref=e55]
        - paragraph [ref=e56]: "Bifrost is the observer-and-signer service run by each THORNode. Its per-chain clients connect to the operator's external-chain nodes and handle relevant events such as:"
        - list [ref=e57]:
          - listitem [ref=e58]: Inbound transactions (users sending assets into vaults)
          - listitem [ref=e59]: Outbound transaction confirmations
          - listitem [ref=e60]: Chain reorganizations and finality
          - listitem [ref=e61]: Chain-specific gas, confirmation, and broadcast conditions
        - paragraph [ref=e62]: The official stack documentation says THORNode operators run connected-chain clients for the network's supported chains. That is an operator architecture requirement, not proof that every current client is synced, healthy, or accepting a particular route.
        - heading "How Observation Works" [level=2] [ref=e63]
        - list [ref=e64]:
          - listitem [ref=e65]: Per-chain observers independently scan new external-chain blocks for transactions involving THORChain vaults. Most ordinary mempool transactions are not treated as final observations.
          - listitem [ref=e66]: Transactions involving Active and Retiring vaults are observed and gossiped for consensus; Inactive-vault handling has stricter recovery limits.
          - listitem [ref=e67]: A transaction observation reaches THORChain consensus when at least 67% of active nodes attest to the same event.
          - listitem [ref=e68]: Delayed-finality chains require a later finalised observation after chain-specific confirmation rules are satisfied.
        - paragraph [ref=e69]: This multi-observer model reduces reliance on any single node's report, while final safety still depends on the active validator set, chain finality, and current protocol controls.
        - paragraph [ref=e70]: Observation is not the same thing as execution. A transaction can be observed while the relevant route is still constrained by halted trading, halted signing, chain-specific controls, dust or fee thresholds, memo validity, pool status, or outbound delivery conditions.
        - heading "Chain Clients And Finality" [level=2] [ref=e71]
        - paragraph [ref=e72]: Bifrost is implemented through chain clients that understand the behavior of each connected chain. The source chain's block time, reorg risk, finality model, gas rules, memo support, and transaction format all matter. Confirmation counts can depend on transaction value, block reward, chain-specific multipliers, and maximum-confirmation controls, so one fixed count is not safe to reuse across chains.
        - paragraph [ref=e73]: "That is why \"Bifrost observed it\" is an incomplete user-facing answer. For an inbound, outbound, or refund investigation, pair observation evidence with:"
        - list [ref=e74]:
          - listitem [ref=e75]: the exact transaction hash and source chain,
          - listitem [ref=e76]: the current inbound-address and router data for that chain,
          - listitem [ref=e77]: current network diagnostics for trading, signing, and chain halt controls,
          - listitem [ref=e78]: quote or memo evidence for the intended action,
          - listitem [ref=e79]: any chain-specific confirmation or gas behavior that affects timing.
        - heading "Why It Matters" [level=2] [ref=e80]
        - paragraph [ref=e81]: Without reliable cross-chain observability, THORChain could not process inbound deposits or confirm outbound withdrawals with source-backed confidence. Bifrost is the subsystem that lets the protocol coordinate cross-chain activity rather than only internal pool accounting.
        - paragraph [ref=e82]:
          - text: Vault status matters to this flow. Active vaults receive new assignments, Retiring vaults remain monitored while funds migrate, and Inactive vaults are no longer normal inbound or signing targets. Never send funds to a retired or inactive vault address; retrieve the current chain address and router from
          - code [ref=e83]: "`inbound_addresses`"
          - text: immediately before constructing an action.
        - heading "What To Verify Before Claiming" [level=2] [ref=e84]
        - paragraph [ref=e85]: "Before making a current Bifrost or route-health claim, verify:"
        - list [ref=e86]:
          - listitem [ref=e87]:
            - code [ref=e88]: "`/network#network-diagnostics`"
            - text: for current chain, trading, signing, and source-warning state.
          - listitem [ref=e89]:
            - text: The relevant THORNode
            - code [ref=e90]: "`inbound_addresses`"
            - text: entry for the chain being discussed.
          - listitem [ref=e91]: Whether the observed vault was Active, Retiring, or Inactive at the relevant time.
          - listitem [ref=e92]: The current quote or transaction evidence when the claim is about one swap, deposit, outbound, or refund.
          - listitem [ref=e93]: Whether the issue is observation, finality, memo/intent validation, pool execution, signing, gas, outbound delivery, or interface behavior.
          - listitem [ref=e94]: Whether an incident or upgrade source is dated historical context rather than proof of current safety.
        - heading "Non-Claims" [level=2] [ref=e95]
        - paragraph [ref=e96]: "This page does not prove:"
        - list [ref=e97]:
          - listitem [ref=e98]: A chain, route, inbound address, router, or outbound path is currently available.
          - listitem [ref=e99]: A specific transaction was observed, executed, refunded, or delayed for one cause.
          - listitem [ref=e100]: That all connected chains have identical finality, gas, or memo behavior.
          - listitem [ref=e101]: That an observation has reached both consensus and chain-specific finality merely because one provider reports it.
          - listitem [ref=e102]: That current chain-client health is clean across providers.
          - listitem [ref=e103]: That Bifrost design alone proves current vault, signing, or route safety.
