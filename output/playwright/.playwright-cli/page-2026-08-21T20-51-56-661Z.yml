          - heading "Architecture" [level=2] [ref=e94]
          - generic [ref=e95]:
            - generic [ref=e96]:
              - heading "Cosmos SDK" [level=3] [ref=e97]
              - paragraph [ref=e98]: THORChain runs its own app-chain with Tendermint-style consensus and protocol modules for swaps, pools, vaults, and Mimir.
              - link "Map source families" [ref=e99] [cursor=pointer]:
                - /url: /deep-dives/build-query-data#source-families
            - generic [ref=e100]:
              - heading "TSS Vaults" [level=3] [ref=e101]
              - paragraph [ref=e102]: Threshold Signature Schemes distribute vault control across node operators. Current cryptography details should be tied to dated protocol sources.
              - link "Read TSS details" [ref=e103] [cursor=pointer]:
                - /url: /deep-dives/tss
            - generic [ref=e104]:
              - heading "Bifrost" [level=3] [ref=e105]
              - paragraph [ref=e106]: Nodes observe external-chain transactions and report them into the THORChain state machine.
              - link "Read Bifrost details" [ref=e107] [cursor=pointer]:
                - /url: /deep-dives/bifrost
            - generic [ref=e108]:
              - heading "Midgard + THORNode" [level=3] [ref=e109]
              - paragraph [ref=e110]: Midgard serves analytics and history. THORNode is the source for live operational state such as Mimir, constants, and inbound addresses.
              - link "Choose the right API" [ref=e111] [cursor=pointer]:
                - /url: /deep-dives/midgard-thornode-data#source-roles
          - heading "Current-State Controls" [level=2] [ref=e112]
          - generic [ref=e113]:
            - generic [ref=e114]:
              - heading "Mimir" [level=3] [ref=e115]
              - paragraph [ref=e116]: Mimir parameters can pause trading, signing, LP actions, churning, TCY claims, RUNEPool, and other protocol behavior. Display these as current-only live data.
              - link "Interpret Mimir controls" [ref=e117] [cursor=pointer]:
                - /url: /deep-dives/mimir-halt-controls#what-mimirs-can-prove
            - generic [ref=e118]:
              - heading "Network Halts" [level=3] [ref=e119]
              - paragraph [ref=e120]: Halts can be chain-specific or global. Interfaces should monitor halt flags before presenting swaps, LP actions, or signing state as available.
              - link "Check live halts" [ref=e121] [cursor=pointer]:
                - /url: /network#network-diagnostics
            - generic [ref=e122]:
              - heading "Inbound Addresses" [level=3] [ref=e123]
              - paragraph [ref=e124]: Routers, gas rates, chain pause flags, and inbound availability are live THORNode facts, not static wiki facts.
              - link "Review inbound usage" [ref=e125] [cursor=pointer]:
                - /url: /deep-dives/build-query-data#quotes-inbound-addresses-and-caching
            - generic [ref=e126]:
              - heading "Constants vs Overrides" [level=3] [ref=e127]
              - paragraph [ref=e128]: Constants describe defaults; Mimir can override them. Current minimum bond or slash settings require reading both sources.
              - link "Verify override posture" [ref=e129] [cursor=pointer]:
                - /url: /deep-dives/mimir-halt-controls#what-to-verify-before-claiming
          - heading "Swap Lifecycle" [level=2] [ref=e130]
          - generic [ref=e131]:
            - generic [ref=e132]:
              - heading "Inbound" [level=3] [ref=e133]
              - paragraph [ref=e134]: Request a fresh quote immediately before submission, then use its inbound address, memo, expiry, dust threshold, and recommended minimum rather than cached transaction inputs.
              - link "Check quote timing" [ref=e135] [cursor=pointer]:
                - /url: /deep-dives/build-query-data#quotes-inbound-addresses-and-caching
            - generic [ref=e136]:
              - heading "Execution" [level=3] [ref=e137]
              - paragraph [ref=e138]: The state machine prices the swap through RUNE-paired pools. Under the advanced queue, market swaps can auto-stream; the quote and memo own limits, interval, and quantity while live controls own availability.
              - link "Check a live route" [ref=e139] [cursor=pointer]:
                - /url: /network#check-a-route
            - generic [ref=e140]:
              - heading "Outbound or Refund" [level=3] [ref=e141]
              - paragraph [ref=e142]: Nodes sign the outbound transaction when signing is available; invalid or impossible transactions can refund according to protocol rules.
              - link "Read refund conditions" [ref=e143] [cursor=pointer]:
                - /url: /deep-dives/streaming-swaps-refunds#why-refunds-happen
          - heading "Key Concepts" [level=2] [ref=e144]
          - generic [ref=e145]:
            - generic [ref=e146]:
              - heading "RUNE Settlement" [level=3] [ref=e147]
              - paragraph [ref=e148]: Every external-asset swap routes through RUNE liquidity, making RUNE the common settlement and bond asset.
              - link "Read settlement details" [ref=e149] [cursor=pointer]:
                - /url: /deep-dives/rune-settlement
            - generic [ref=e150]:
              - heading "Continuous Liquidity Pools" [level=3] [ref=e151]
              - paragraph [ref=e152]: Slip-based pricing makes larger trades pay proportionally more, protecting liquidity providers from depth-consuming trades.
              - link "Read CLP mechanics" [ref=e153] [cursor=pointer]:
                - /url: /deep-dives/clp
            - generic [ref=e154]:
              - heading "App Layer and CosmWasm" [level=3] [ref=e155]
              - paragraph [ref=e156]: Permissioned CosmWasm contracts add application behavior; secured assets and trade accounts are separate protocol concepts that need their own live checks.
              - link "Read app-layer scope" [ref=e157] [cursor=pointer]:
                - /url: /deep-dives/app-layer
            - generic [ref=e158]:
              - heading "Minimal Governance" [level=3] [ref=e159]
              - paragraph [ref=e160]: Node operators and Mimir handle operational parameters; ADRs/TIPs document changes. Avoid saying ordinary RUNE holders directly govern every protocol decision.
