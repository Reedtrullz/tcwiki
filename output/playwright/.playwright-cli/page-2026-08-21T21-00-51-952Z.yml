      - article [ref=e41]:
        - paragraph [ref=e42]: The Continuous Liquidity Pool is the core innovation that allows THORChain to offer native cross-chain swaps without order books or wrapped assets.
        - heading "What CLP Can Prove" [level=2] [ref=e43]
        - paragraph [ref=e44]: "CLP explains how THORChain prices a pool-based swap and why larger trades pay more slip/liquidity fee. It can support narrow mechanism claims:"
        - list [ref=e45]:
          - listitem [ref=e46]: THORChain pools pair external assets with RUNE rather than isolated asset-to-asset order books.
          - listitem [ref=e47]: The CLP formula links input size, pool depth, slip, liquidity fee, and output amount.
          - listitem [ref=e48]: RUNE-paired pools let a cross-chain route compose through shared settlement liquidity.
          - listitem [ref=e49]: Slip-based pricing makes depth-consuming trades progressively more expensive and directs the liquidity fee to pool capital; it does not eliminate LP risk.
        - paragraph [ref=e50]: It does not, by itself, prove that a current route is quoteable, cheap, available, or safe to execute. Current execution still depends on a fresh quote, live pool depth, inbound address state, chain/trading/signing controls, outbound fee economics, memo validity, and source quality.
        - heading "How CLP Works" [level=2] [ref=e51]
        - paragraph [ref=e52]: "Every pool consists of RUNE paired with an external asset. THORChain docs describe slippage as the input size relative to pool depth, then use that slippage to derive the liquidity fee and final output:"
        - code [ref=e54]: slip = x / (X + x) fee = (x^2 * Y) / (x + X)^2 output = (x * X * Y) / (x + X)^2
        - paragraph [ref=e55]:
          - text: Where
          - code [ref=e56]: "`x`"
          - text: is the input amount,
          - code [ref=e57]: "`X`"
          - text: is the input-side pool depth, and
          - code [ref=e58]: "`Y`"
          - text: is the output-side pool depth. The slip ratio is not itself the fee amount; the fee is denominated in the output asset.
        - heading "Key Properties" [level=2] [ref=e59]
        - list [ref=e60]:
          - listitem [ref=e61]:
            - strong [ref=e62]: Quoteable through pool depth
            - text: ": CLP pricing can produce a quote across available pool depth, but execution still depends on current halt state, quote limits, outbound fees, recommended minimums, and refund rules."
          - listitem [ref=e63]:
            - strong [ref=e64]: Progressive slippage
            - text: ": Larger trades pay proportionally more, making abrupt pool-price movement more expensive without guaranteeing LP protection or route safety."
          - listitem [ref=e65]:
            - strong [ref=e66]: Separate LP action availability
            - text: ": Pool mechanics do not prove that LP adds, withdrawals, pool-specific deposits, or asymmetric withdrawals are currently open. Use the"
            - link "Liquidity Actions" [ref=e67] [cursor=pointer]:
              - /url: /deep-dives/liquidity-actions#what-to-check-first
            - text: evidence guide before turning CLP mechanics into LP workflow claims.
          - listitem [ref=e68]:
            - strong [ref=e69]: Historical single-sided products
            - text: ": Savers previously offered single-asset exposure, but official archived docs now mark Savers and Lending as deprecated."
        - paragraph [ref=e70]: If a swap limit is not met, the amount is below the recommended minimum, fees exceed the practical output, or a relevant chain/trading/signing control is halted, the transaction can be refunded or remain unavailable. Treat swap availability as live/current-only, not as a static property of the CLP formula.
        - heading "Evidence Ladder" [level=2] [ref=e71]
        - paragraph [ref=e72]: "Use the narrowest evidence that matches the claim:"
        - list [ref=e73]:
          - listitem [ref=e74]:
            - strong [ref=e75]: "Mechanism claim:"
            - text: use the CLP formula and official THORChain docs to explain slip, liquidity fee, and RUNE-paired pools.
          - listitem [ref=e76]:
            - strong [ref=e77]: "Current quote claim:"
            - text: use a fresh THORNode quote for the exact route and amount. Keep expected output, fees, slippage bps, recommended minimum input, expiry, and warning text attached.
          - listitem [ref=e78]:
            - strong [ref=e79]: "Current availability claim:"
            - text: use
            - link "Network diagnostics" [ref=e80] [cursor=pointer]:
              - /url: /network#network-diagnostics
            - text: for trading, signing, chain observation, source warnings, and quote-probe posture.
          - listitem [ref=e81]:
            - strong [ref=e82]: "Pool-depth or APY claim:"
            - text: use Midgard pool and earnings data with source labels, unavailable-interval counts, and degraded-state warnings.
          - listitem [ref=e83]:
            - strong [ref=e84]: "LP action claim:"
            - text: use the
            - link "Liquidity Actions" [ref=e85] [cursor=pointer]:
              - /url: /deep-dives/liquidity-actions#what-to-check-first
            - text: guide before saying add, withdraw, pool deposit, asymmetric withdrawal, or RUNEPool actions are open.
          - listitem [ref=e86]:
            - strong [ref=e87]: "Refund or failure claim:"
            - text: use the
            - link "Streaming Swaps And Refunds" [ref=e88] [cursor=pointer]:
              - /url: /deep-dives/streaming-swaps-refunds#evidence-ladder
            - text: evidence ladder with the exact quote, memo, transaction hash, and network state.
        - paragraph [ref=e89]: If a statement jumps from the formula straight to a present-tense action, label the result as partial evidence.
        - heading "Swap Lifecycle and Refunds" [level=2] [ref=e90]
        - paragraph [ref=e91]: "A normal swap journey starts before the CLP math is executed:"
        - list [ref=e92]:
          - listitem [ref=e93]: The user or interface asks THORNode for a quote and checks the current inbound address, router, fees, limits, and expected wait time.
          - listitem [ref=e94]: The user sends the native asset to the current inbound address with a memo that names the action, target asset, destination, and optional affiliate or streaming parameters.
          - listitem [ref=e95]: Bifrost observers report the inbound transaction to THORChain, where current Mimir controls, chain state, memo validity, pool status, and quote limits determine whether the swap can proceed.
          - listitem [ref=e96]: The state machine prices the swap through RUNE-paired pools, applying slip, liquidity fees, outbound fees, and current protocol rules.
          - listitem [ref=e97]: If execution is valid and signing is available, nodes sign the outbound transaction. If the memo, limits, pool state, dust amount, fee economics, halt state, or outbound path make the action invalid or impossible, the protocol can refund instead.
        - paragraph [ref=e98]: Refunds are therefore not one single failure mode. They can point to user-input problems, stale quotes, minimum-output protection, paused chains, signing/trading controls, exhausted practical output after fees, or source-state changes between quote and execution. Use live network diagnostics before concluding that a refund was caused by the CLP formula itself.
        - paragraph [ref=e99]:
          - text: For operational triage, use the dedicated
          - link "Streaming Swaps And Refunds" [ref=e100] [cursor=pointer]:
            - /url: /deep-dives/streaming-swaps-refunds
          - text: article before assigning a refund cause.
        - heading "Comparison to Traditional AMMs" [level=2] [ref=e101]
        - paragraph [ref=e102]: THORChain's CLP is a constant-function pool design with slip-based pricing, adapted to native cross-chain settlement through RUNE-paired pools. Its distinctive claim is the shared RUNE settlement graph and native-asset execution model, not an escape from constant-product-style pool economics. Current chain availability should be checked from live inbound-address and pool status, not from a hard-coded chain count.
        - heading "What To Verify Before Claiming" [level=2] [ref=e103]
        - paragraph [ref=e104]: "Before making a CLP, swap, fee, liquidity, or LP statement, verify:"
        - list [ref=e105]:
          - listitem [ref=e106]: Whether the statement is about the formula, a current quote, route availability, pool depth, LP availability, or a historical product.
          - listitem [ref=e107]: The current quote response for the exact route and amount if the claim is user-facing or route-specific.
          - listitem [ref=e108]:
            - text: Current
            - link "Network diagnostics" [ref=e109] [cursor=pointer]:
              - /url: /network#network-diagnostics
            - text: for trading, signing, chain halts, LP controls, and source-warning state.
          - listitem [ref=e110]: Current Midgard pool and earnings source quality before quoting depth, APY, or recent earnings.
          - listitem [ref=e111]: Whether the claim belongs in the refund guide, liquidity-actions guide, RUNEPool/POL guide, or dynamic-fee tracker instead of the CLP formula page.
          - listitem [ref=e112]: The source provider, checked time, block height when available, and whether missing fields were shown as unavailable rather than zero.
        - heading "Non-Claims" [level=2] [ref=e113]
        - paragraph [ref=e114]: "This page does not prove:"
        - list [ref=e115]:
          - listitem [ref=e116]: A route is currently quoteable, executable, cheap, or safe.
          - listitem [ref=e117]: A swap will not refund, expire, miss minimum output, or fail on memo, dust, fee, halt, signing, or outbound conditions.
          - listitem [ref=e118]: Current pool depth, APY, liquidity provider earnings, or route competitiveness.
          - listitem [ref=e119]: That LP adds, withdrawals, pool deposits, asymmetric withdrawals, RUNEPool, Savers, Lending, or secured-asset flows are available.
          - listitem [ref=e120]: That a static formula is wallet guidance, transaction construction, or support diagnosis.
          - listitem [ref=e121]: That a current quote or dashboard number proves future yield, profitability, safety, or investment suitability.
