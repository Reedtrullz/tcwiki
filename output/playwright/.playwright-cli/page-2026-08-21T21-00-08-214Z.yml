        - generic [ref=e82]:
          - generic [ref=e83]:
            - heading "Cosmos SDK" [level=3] [ref=e84]
            - paragraph [ref=e85]: THORChain runs its own app-chain with Tendermint-style consensus and protocol modules for swaps, pools, vaults, and Mimir.
            - link "Map source families" [ref=e86] [cursor=pointer]:
              - /url: /deep-dives/build-query-data#source-families
          - generic [ref=e87]:
            - heading "TSS Vaults" [level=3] [ref=e88]
            - paragraph [ref=e89]: Threshold Signature Schemes distribute vault control across node operators. Current cryptography details should be tied to dated protocol sources.
            - link "Read TSS details" [ref=e90] [cursor=pointer]:
              - /url: /deep-dives/tss
          - generic [ref=e91]:
            - heading "Bifrost" [level=3] [ref=e92]
            - paragraph [ref=e93]: Nodes observe external-chain transactions and report them into the THORChain state machine.
            - link "Read Bifrost details" [ref=e94] [cursor=pointer]:
              - /url: /deep-dives/bifrost
          - generic [ref=e95]:
            - heading "Midgard + THORNode" [level=3] [ref=e96]
            - paragraph [ref=e97]: Midgard serves analytics and history. THORNode is the source for live operational state such as Mimir, constants, and inbound addresses.
            - link "Choose the right API" [ref=e98] [cursor=pointer]:
              - /url: /deep-dives/midgard-thornode-data#source-roles
        - heading "Current-State Controls" [level=2] [ref=e99]
        - generic [ref=e100]:
          - generic [ref=e101]:
            - heading "Mimir" [level=3] [ref=e102]
            - paragraph [ref=e103]: Mimir parameters can pause trading, signing, LP actions, churning, TCY claims, RUNEPool, and other protocol behavior. Display these as current-only live data.
            - link "Interpret Mimir controls" [ref=e104] [cursor=pointer]:
              - /url: /deep-dives/mimir-halt-controls#what-mimirs-can-prove
          - generic [ref=e105]:
            - heading "Network Halts" [level=3] [ref=e106]
            - paragraph [ref=e107]: Halts can be chain-specific or global. Interfaces should monitor halt flags before presenting swaps, LP actions, or signing state as available.
            - link "Check live halts" [ref=e108] [cursor=pointer]:
              - /url: /network#network-diagnostics
          - generic [ref=e109]:
            - heading "Inbound Addresses" [level=3] [ref=e110]
            - paragraph [ref=e111]: Routers, gas rates, chain pause flags, and inbound availability are live THORNode facts, not static wiki facts.
            - link "Review inbound usage" [ref=e112] [cursor=pointer]:
              - /url: /deep-dives/build-query-data#quotes-inbound-addresses-and-caching
          - generic [ref=e113]:
            - heading "Constants vs Overrides" [level=3] [ref=e114]
            - paragraph [ref=e115]: Constants describe defaults; Mimir can override them. Current minimum bond or slash settings require reading both sources.
            - link "Verify override posture" [ref=e116] [cursor=pointer]:
              - /url: /deep-dives/mimir-halt-controls#what-to-verify-before-claiming
        - heading "Swap Lifecycle" [level=2] [ref=e117]
        - generic [ref=e118]:
          - generic [ref=e119]:
            - heading "Inbound" [level=3] [ref=e120]
            - paragraph [ref=e121]: Request a fresh quote immediately before submission, then use its inbound address, memo, expiry, dust threshold, and recommended minimum rather than cached transaction inputs.
            - link "Check quote timing" [ref=e122] [cursor=pointer]:
              - /url: /deep-dives/build-query-data#quotes-inbound-addresses-and-caching
          - generic [ref=e123]:
            - heading "Execution" [level=3] [ref=e124]
            - paragraph [ref=e125]: The state machine prices the swap through RUNE-paired pools. Under the advanced queue, market swaps can auto-stream; the quote and memo own limits, interval, and quantity while live controls own availability.
            - link "Check a live route" [ref=e126] [cursor=pointer]:
              - /url: /network#check-a-route
          - generic [ref=e127]:
            - heading "Outbound or Refund" [level=3] [ref=e128]
            - paragraph [ref=e129]: Nodes sign the outbound transaction when signing is available; invalid or impossible transactions can refund according to protocol rules.
            - link "Read refund conditions" [ref=e130] [cursor=pointer]:
              - /url: /deep-dives/streaming-swaps-refunds#why-refunds-happen
        - heading "Key Concepts" [level=2] [ref=e131]
        - generic [ref=e132]:
          - generic [ref=e133]:
            - heading "RUNE Settlement" [level=3] [ref=e134]
            - paragraph [ref=e135]: Every external-asset swap routes through RUNE liquidity, making RUNE the common settlement and bond asset.
            - link "Read settlement details" [ref=e136] [cursor=pointer]:
              - /url: /deep-dives/rune-settlement
          - generic [ref=e137]:
            - heading "Continuous Liquidity Pools" [level=3] [ref=e138]
            - paragraph [ref=e139]: Slip-based pricing makes larger trades pay proportionally more, protecting liquidity providers from depth-consuming trades.
            - link "Read CLP mechanics" [ref=e140] [cursor=pointer]:
              - /url: /deep-dives/clp
          - generic [ref=e141]:
            - heading "App Layer and CosmWasm" [level=3] [ref=e142]
            - paragraph [ref=e143]: Permissioned CosmWasm contracts add application behavior; secured assets and trade accounts are separate protocol concepts that need their own live checks.
            - link "Read app-layer scope" [ref=e144] [cursor=pointer]:
              - /url: /deep-dives/app-layer
          - generic [ref=e145]:
            - heading "Minimal Governance" [level=3] [ref=e146]
            - paragraph [ref=e147]: Node operators and Mimir handle operational parameters; ADRs/TIPs document changes. Avoid saying ordinary RUNE holders directly govern every protocol decision.
            - link "Check governance framing" [ref=e148] [cursor=pointer]:
