            - generic [ref=e237]:
              - heading "Standby" [level=3] [ref=e238]
              - paragraph [ref=e239]: Bonded but not active. Current requirements are evaluated during churn; only Standby nodes outside vault migration may unbond.
            - generic [ref=e240]:
              - heading "Ready" [level=3] [ref=e241]
              - paragraph [ref=e242]: Passed current preflight requirements and is eligible for churn selection; a node cannot unbond while Ready.
            - generic [ref=e243]:
              - heading "Active" [level=3] [ref=e244]
              - paragraph [ref=e245]: Participates in consensus, observation, and signing; it cannot unbond until churned to Standby and clear of vault migration.
            - generic [ref=e246]:
              - heading "Disabled" [level=3] [ref=e247]
              - paragraph [ref=e248]: Completed the permanent-leave path while Standby and cannot rejoin with the same node account.
