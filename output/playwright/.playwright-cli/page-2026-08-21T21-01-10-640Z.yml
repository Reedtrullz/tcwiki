      - article [ref=e40]:
        - paragraph [ref=e41]: Mimir values are THORChain operational controls. They let the network change parameters, pause scoped actions, and schedule some controls without changing the protocol code every time. This article explains how to read those controls without turning a static docs page into a false current-status claim.
        - paragraph [ref=e42]:
          - text: For current availability, start with
          - code [ref=e43]: "`/network#network-diagnostics`"
          - text: . This page is the map for interpreting the evidence.
        - heading "What Mimirs Can Prove" [level=2] [ref=e44]
        - paragraph [ref=e45]: Mimirs can support a precise current-state claim when the claim names the action, scope, source, and checked height.
        - paragraph [ref=e46]: "Good wording sounds like:"
        - list [ref=e47]:
          - listitem [ref=e48]: "\"Trading is halted for BSC in this checked THORNode snapshot.\""
          - listitem [ref=e49]: "\"A network-wide LP pause applies, so LP actions should not be described as available from this snapshot.\""
          - listitem [ref=e50]: "\"Operation-like Mimir keys need review, so the source quality is degraded even when a specific route blocker is visible.\""
        - paragraph [ref=e51]: "Risky wording sounds like:"
        - list [ref=e52]:
          - listitem [ref=e53]: "\"THORChain is paused\" when only LP, loan, churn, or one chain route is affected."
          - listitem [ref=e54]: "\"Swaps are healthy\" because no global halt key appears in one source read."
          - listitem [ref=e55]: "\"This app is safe\" because a WASM halt key is absent."
        - paragraph [ref=e56]: Mimir evidence is strongest when paired with the exact key, source freshness, block height, and the user action being discussed.
        - heading "Control Families" [level=2] [ref=e57]
        - paragraph [ref=e58]: The same word "halt" can apply to very different operations. Keep the families separate.
        - heading "Ordinary swap controls" [level=3] [ref=e59]
        - paragraph [ref=e60]: "Use these when the claim is about base-layer swaps:"
        - list [ref=e61]:
          - listitem [ref=e62]:
            - code [ref=e63]: "`HALTTRADING`"
            - text: and chain-scoped trading keys.
          - listitem [ref=e64]:
            - code [ref=e65]: "`HALTSIGNING`"
            - text: and chain-scoped signing keys.
          - listitem [ref=e66]:
            - text: Chain halt fields from
            - code [ref=e67]: "`inbound_addresses`"
            - text: .
          - listitem [ref=e68]:
            - text: Quote errors from THORNode
            - code [ref=e69]: "`/thorchain/quote/swap`"
            - text: for a specific route.
          - listitem [ref=e70]:
            - text: Streaming and memo-related controls such as
            - code [ref=e71]: "`StreamingSwapPause`"
            - text: and
            - code [ref=e72]: "`HaltMemoless`"
            - text: .
        - paragraph [ref=e73]: These are the controls that should drive phrases such as "ordinary swaps available", "some routes limited", or "route blocked".
        - heading "LP, pool, loan, and churn controls" [level=3] [ref=e74]
        - paragraph [ref=e75]: "These controls matter, but they should not make ordinary swaps look globally halted:"
        - list [ref=e76]:
          - listitem [ref=e77]:
            - code [ref=e78]: "`PAUSELP`"
            - text: and chain-scoped LP controls.
          - listitem [ref=e79]: Pool-specific deposit controls.
          - listitem [ref=e80]:
            - code [ref=e81]: "`PAUSELOANS`"
            - text: .
          - listitem [ref=e82]:
            - code [ref=e83]: "`HALTCHURNING`"
            - text: .
          - listitem [ref=e84]:
            - text: RUNEPool controls such as
            - code [ref=e85]: "`RUNEPoolHaltDeposit`"
            - text: and
            - code [ref=e86]: "`RUNEPoolHaltWithdraw`"
            - text: .
        - paragraph [ref=e87]: If one of these is active, label the affected operation. Do not collapse it into "swaps paused" unless a swap control also supports that claim.
        - heading "App Layer, secured-asset, and trade-account controls" [level=3] [ref=e88]
        - paragraph [ref=e89]: "App Layer and account-style flows have their own controls:"
        - list [ref=e90]:
          - listitem [ref=e91]:
            - code [ref=e92]: "`HaltWasmGlobal`"
            - text: ","
            - code [ref=e93]: "`HaltWasmDeployer-*`"
            - text: ","
            - code [ref=e94]: "`HaltWasmCs-*`"
            - text: ", and"
            - code [ref=e95]: "`HaltWasmContract-*`"
            - text: .
          - listitem [ref=e96]:
            - code [ref=e97]: "`HaltOracle`"
            - text: .
          - listitem [ref=e98]:
            - code [ref=e99]: "`HaltSecuredGlobal`"
            - text: ","
            - code [ref=e100]: "`HaltSecuredDeposit-*`"
            - text: ", and"
            - code [ref=e101]: "`HaltSecuredWithdraw-*`"
            - text: .
          - listitem [ref=e102]:
            - code [ref=e103]: "`TradeAccountsEnabled`"
            - text: and related trade-account deposit controls.
        - paragraph [ref=e104]: These controls are scoped. A specific contract, code checksum, deployer, secured-asset flow, or trade-account action can be limited while ordinary swaps remain available.
        - heading "Node and operator controls" [level=3] [ref=e105]
        - paragraph [ref=e106]: "Node operations use another family:"
        - list [ref=e107]:
          - listitem [ref=e108]:
            - code [ref=e109]: "`PauseBond`"
            - text: .
          - listitem [ref=e110]:
            - code [ref=e111]: "`PauseUnbond`"
            - text: .
          - listitem [ref=e112]:
            - code [ref=e113]: "`HaltRebond`"
            - text: .
          - listitem [ref=e114]:
            - code [ref=e115]: "`HaltOperatorRotate`"
            - text: .
        - paragraph [ref=e116]: These keys affect node/operator workflows. They should not be used as route-availability proof unless the claim is about the relevant node action.
        - heading "Active, Scheduled, Inactive, Absent" [level=2] [ref=e117]
        - paragraph [ref=e118]: "The dashboard should distinguish four states:"
        - list [ref=e119]:
          - listitem [ref=e120]:
            - strong [ref=e121]: "Active:"
            - text: the key or source field currently blocks the scoped action.
          - listitem [ref=e122]:
            - strong [ref=e123]: "Scheduled:"
            - text: the value refers to a future or height-dependent control, so the claim depends on the checked block height.
          - listitem [ref=e124]:
            - strong [ref=e125]: "Inactive:"
            - text: the key is known and present but does not currently block the scoped action.
          - listitem [ref=e126]:
            - strong [ref=e127]: "Absent:"
            - text: the key was not returned by the source snapshot.
        - paragraph [ref=e128]: Absent is the easiest state to overread. A missing halt key is not full proof that every related operation is healthy. It only means that key was not present in the checked source response. Current availability still depends on inbound fields, pool state, route quote behavior, provider freshness, and whether the relevant key family is fully understood by the dashboard.
        - heading "Scoped Keys And Normalization" [level=2] [ref=e129]
        - paragraph [ref=e130]: Many halt controls are scoped rather than global. Scope can come from a chain suffix, pool, contract address suffix, deployer, checksum, or account-flow family.
        - paragraph [ref=e131]: "When interpreting a scoped control:"
        - list [ref=e132]:
          - listitem [ref=e133]: Normalize the chain or asset name before comparing values.
          - listitem [ref=e134]: Separate network-wide controls from chain-specific controls.
          - listitem [ref=e135]: Render network-wide controls once instead of repeating them on every chain.
          - listitem [ref=e136]: Preserve the exact raw key in collapsed diagnostics for auditability.
          - listitem [ref=e137]: Avoid inventing a healthy status for unknown or malformed keys.
        - paragraph [ref=e138]: "This is why a good diagnostics panel names the user-facing blocker first, then keeps raw Mimir keys in a disclosure. A reader needs \"BSC: trading halted\" before they need the exact key spelling."
        - heading "Source Warnings And Review Keys" [level=2] [ref=e139]
        - paragraph [ref=e140]: Operational source warnings should degrade the data-quality label even when the visible blocker is clear.
        - paragraph [ref=e141]: "Examples:"
        - list [ref=e142]:
          - listitem [ref=e143]: A stale or unpinned source means the page should not present the data as a fresh snapshot.
          - listitem [ref=e144]: A malformed Mimir value should be shown as a warning, not coerced to zero.
          - listitem [ref=e145]: An unknown operation-like Mimir key should enter a review queue until the dashboard knows how to classify it.
          - listitem [ref=e146]: Duplicate or conflicting scoped records should fail closed for that provider.
        - paragraph [ref=e147]: "Unknown keys are not automatically active halts. They are a source-quality problem. The practical posture is: show the known current blockers, disclose the review queue, and avoid claiming complete coverage."
        - heading "What To Verify Before Claiming" [level=2] [ref=e148]
        - paragraph [ref=e149]: "Before saying an action is available, limited, or paused, verify:"
        - list [ref=e150]:
          - listitem [ref=e151]:
            - text: The current
            - code [ref=e152]: "`/network#network-diagnostics`"
            - text: headline and limited-chain list.
          - listitem [ref=e153]: Whether the claim is about ordinary swaps, LP actions, pool deposits, secured assets, app-layer contracts, TCY/RUNEPool, node operations, or a specific route quote.
          - listitem [ref=e154]: The exact Mimir key or source field behind the blocker.
          - listitem [ref=e155]: The source provider, checked time, block height, and data-quality badge.
          - listitem [ref=e156]: Whether a network-wide control is being repeated as inherited context or directly blocking the chain/action.
          - listitem [ref=e157]: For a concrete route, the current quote result from THORNode rather than a broad chain-level assumption.
        - paragraph [ref=e158]: Use static docs for design meaning. Use live THORNode, inbound-address, quote, and Midgard evidence for current claims.
        - heading "Non-Claims" [level=2] [ref=e159]
        - paragraph [ref=e160]: "This page does not prove:"
        - list [ref=e161]:
          - listitem [ref=e162]: Future availability after the checked block or epoch.
          - listitem [ref=e163]: That a missing halt key means an action is safe or healthy.
          - listitem [ref=e164]: Wallet, interface, memo, inbound-address, or transaction safety.
          - listitem [ref=e165]: Historical uptime, incident status, or post-upgrade readiness.
          - listitem [ref=e166]: Route competitiveness, liquidity depth, or expected execution quality.
          - listitem [ref=e167]: That every unknown operation-like key has no user impact.
        - paragraph [ref=e168]: Mimir controls are powerful evidence, but only when the claim stays scoped to the action, key, source, and checked snapshot.
